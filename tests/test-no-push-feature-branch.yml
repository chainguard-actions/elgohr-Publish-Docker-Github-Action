name: Test no_push on feature branch (branch name tag)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/feature-my-feature
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc123def456
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          name: test-image
          username: ""
          password: ""
          no_push: "true"
          workdir: ${{ github.workspace }}/tests/fixtures

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no_push=true on feature branch"
          echo "PASS: action ran successfully"
