name: Test default branch produces latest tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Dockerfile to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/Dockerfile" "$GITHUB_WORKSPACE/Dockerfile"

      - id: action
        uses: .
        with:
          name: test/defaultbranch
          username: ""
          password: ""
          # act-harness is the branch name under act; set it as default_branch so
          # the action maps it to the "latest" tag
          default_branch: "act-harness"
          no_push: "true"

      - name: Assert Docker image was built with latest tag
        run: |
          echo "Docker images:"
          docker images
          if docker images | grep "test/defaultbranch" | grep -q "latest"; then
            echo "PASS: Docker image test/defaultbranch:latest was built (default branch = act-harness)"
          else
            echo "FAIL: Docker image test/defaultbranch:latest was not found"
            exit 1
          fi
