name: Test action fails when name input is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/master
      GITHUB_SHA: abc123def456
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install mock docker
        run: |
          cat > /usr/local/bin/docker << 'EOF'
          #!/bin/sh
          echo "mock-docker: $*" >&2
          exit 0
          EOF
          chmod +x /usr/local/bin/docker

      - name: Run action without name (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: ""
          username: fakeuser
          password: fakepassword
          no_push: "true"

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when name is missing, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when name was missing"
