name: Test cache input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Dockerfile to workspace
        run: cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/Dockerfile" "$GITHUB_WORKSPACE/Dockerfile"

      - name: Install mock docker that records args
        run: |
          cat > /usr/local/bin/docker << 'EOF'
          #!/bin/sh
          echo "mock-docker: $*" >> /tmp/docker-calls.log
          echo "mock-docker: $*" >&2
          # For "docker pull", exit 1 to simulate image not cached yet (no cache-from added)
          case "$1" in
            pull) exit 1 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x /usr/local/bin/docker

      - id: action
        uses: .
        with:
          name: test/cache-image
          username: ""
          password: ""
          tags: "cache-test"
          cache: "true"
          no_push: "true"

      - name: Assert cache pull was attempted
        run: |
          echo "Docker calls:"
          cat /tmp/docker-calls.log || true
          if grep -q "pull" /tmp/docker-calls.log; then
            echo "PASS: docker pull was called (cache attempt)"
          else
            echo "FAIL: docker pull was not called — cache input may not be working"
            cat /tmp/docker-calls.log
            exit 1
          fi
