name: Test buildoptions input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Dockerfile to workspace
        run: cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/Dockerfile" "$GITHUB_WORKSPACE/Dockerfile"

      - name: Install mock docker that records args
        run: |
          cat > /usr/local/bin/docker << 'EOF'
          #!/bin/sh
          echo "mock-docker: $*" >> /tmp/docker-calls.log
          echo "mock-docker: $*" >&2
          exit 0
          EOF
          chmod +x /usr/local/bin/docker

      - id: action
        uses: .
        with:
          name: test/buildoptions
          username: ""
          password: ""
          tags: "buildoptions-test"
          buildoptions: "--no-cache"
          no_push: "true"

      - name: Assert buildoptions were passed to docker build
        run: |
          echo "Docker calls:"
          cat /tmp/docker-calls.log || true
          if grep -q -- "--no-cache" /tmp/docker-calls.log; then
            echo "PASS: --no-cache was passed to docker build"
          else
            echo "FAIL: --no-cache was not found in docker build call"
            cat /tmp/docker-calls.log
            exit 1
          fi
