name: Test custom registry prefix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Dockerfile to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/Dockerfile" "$GITHUB_WORKSPACE/Dockerfile"

      - id: action
        uses: .
        with:
          name: myorg/myimage
          username: ""
          password: ""
          registry: ghcr.io
          tags: "registry-test"
          no_push: "true"

      - name: Assert Docker image was built with registry prefix
        run: |
          echo "Docker images:"
          docker images
          # The action prepends registry to name: ghcr.io/myorg/myimage
          if docker images | grep -q "ghcr.io/myorg/myimage"; then
            echo "PASS: Docker image ghcr.io/myorg/myimage was built with registry prefix"
          else
            echo "FAIL: Docker image ghcr.io/myorg/myimage was not found"
            exit 1
          fi
