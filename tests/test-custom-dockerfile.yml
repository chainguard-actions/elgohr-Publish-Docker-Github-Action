name: Test custom Dockerfile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          name: test/customdockerfile
          username: ""
          password: ""
          dockerfile: tests/fixtures/Dockerfile
          tags: "custom-df-test"
          no_push: "true"

      - name: Assert Docker image was built with custom Dockerfile
        run: |
          echo "Docker images:"
          docker images
          if docker images | grep "test/customdockerfile" | grep -q "custom-df-test"; then
            echo "PASS: Docker image test/customdockerfile:custom-df-test was built using custom Dockerfile"
          else
            echo "FAIL: Docker image test/customdockerfile:custom-df-test was not found"
            exit 1
          fi
