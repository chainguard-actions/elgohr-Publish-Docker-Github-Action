name: Test custom default_branch produces latest tag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture Dockerfile to workspace
        run: cp "$GITHUB_WORKSPACE/tests/fixtures/Dockerfile" "$GITHUB_WORKSPACE/Dockerfile"

      - id: action
        uses: .
        with:
          name: test/customdefault
          username: ""
          password: ""
          default_branch: "act-harness"
          no_push: "true"

      - name: Assert Docker image was built with latest tag for custom default branch
        run: |
          echo "Docker images:"
          docker images
          if docker images | grep "test/customdefault" | grep -q "latest"; then
            echo "PASS: Docker image test/customdefault:latest was built (custom default_branch=act-harness)"
          else
            echo "FAIL: Docker image test/customdefault:latest was not found"
            exit 1
          fi
