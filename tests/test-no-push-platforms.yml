name: Test no_push with platforms (multi-arch)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_SHA: abc123def456
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU for multi-arch builds
        run: docker run --rm --privileged multiarch/qemu-user-static --reset -p yes || true

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name multiarch-builder || true

      - id: action
        uses: .
        with:
          name: test-image
          username: ""
          password: ""
          no_push: "true"
          platforms: "linux/amd64"
          workdir: ${{ github.workspace }}/tests/fixtures

      - name: Assert action completed successfully
        run: |
          echo "Action completed with no_push=true and platforms=linux/amd64"
          echo "PASS: action ran successfully"
